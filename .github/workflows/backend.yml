name: Backend

on:
  push:
    paths: ['backend/**', 'db/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'db/**', '.github/workflows/backend.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zabay_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zabay_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../db/schema.sql
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../db/seeds/bohol_venues_seed.sql
      - run: npm run build
      - run: npm test
